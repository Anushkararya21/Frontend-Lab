<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <h2><i><u>Cafe Timings</u></i></h2>
    <table bgcolor="Black" width="700" border="5" cellpadding="5" cellspacing="5"> 
        <tr bgcolor="Grey" >
            <th width="100"><font size="5">Sunday</font></th>
            <th width="100">Monday</th>
            <th width="100">Tuesday</th>
            <th width="100">Wednesday</th>
            <th width="100">Thursday</th>
            <th width="100">Friday</th>
            <th width="100">Saturday</th>
        </tr>

        <tr bgcolor="LightGrey" align="center">
            <td>Closed</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>Closed</td>
        </tr>
        
    </table>
    
</body>
</html>
