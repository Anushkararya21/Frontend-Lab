<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function</title>
</head>
<body>
    <script>    
        var d = 10;
        setInterval(()=>{
            console.log(8*d);
            d--;
            if(d<5){
                clearInterval();
            }
        },2000)
    </script>
</body>
</html>
